name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: report-consolidator-linux
            binary_src: dist/report-consolidator.bin
            binary_dst: dist/report-consolidator-linux
          - os: windows-latest
            artifact_name: report-consolidator-windows.exe
            binary_src: dist/report-consolidator.exe
            binary_dst: dist/report-consolidator-windows.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf libgl1-mesa-dev ccache

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build with Nuitka
        run: uv run python build.py

      - name: Rename and verify output binary
        shell: bash
        run: |
          if [ -f "${{ matrix.binary_src }}" ]; then
            mv "${{ matrix.binary_src }}" "${{ matrix.binary_dst }}"
          elif [ -f "dist/report-consolidator" ]; then
            mv "dist/report-consolidator" "${{ matrix.binary_dst }}"
          fi
          ls -lh dist/

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_dst }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
