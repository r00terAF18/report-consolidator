[project]
name = "report-consolidator"
version = "0.3.0"
description = "Themed Daily Report Consolidator GUI with PySide6 and Nuitka"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyside6>=6.6.0",
    "openpyxl>=3.1.2",
    "pypdf>=3.0.0",
]

[dependency-groups]
dev = [
    "nuitka>=2.1.0",
    "ordered-set>=4.1.0",
    "zstandard>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/my_qt_app"]
